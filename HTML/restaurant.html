<!DOCTYPE html>
<html>
<head>
    <title>My Restaurant</title>

    <style>
        body {
            font-family: Arial;
            background-color: #fff8f0;
            margin: 0;
        }

        header {
            background-color: #2a008b;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .menu {
            text-align: center;
            padding: 30px;
        }

        .food {
            background-color: white;
            width: 250px;
            display: inline-block;
            margin: 15px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .food img {
            width: 250px;
            height: 150px;
            object-fit: cover;
        }

        .food h2 {
            color:black 8b0000;
        }

        footer {
            background-color: #00768b;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

<header>
    <h1>Delicious Restaurant</h1>
    <p>Good Food • Great Taste • Happy Moments</p>
</header>

<div class="menu">

    <h1>Our Menu</h1>

    <div class="food">
        <img src="pizza.jpg" alt="Pizza">
        <h2>Pizza</h2>
        <p>Cheesy and delicious pizza.</p>
        <p>₹199</p>
    </div>

    <div class="food">
        <img src="burger.jpg" alt="Burger">
        <h2>Burger</h2>
        <p>Fresh and tasty burger.</p>
